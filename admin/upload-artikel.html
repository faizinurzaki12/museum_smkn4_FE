<!doctype html>
<html lang="id" class="overflow-x-hidden">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="assets/img/favicon.png">
    <title>Tambah Artikel - Museum Karya PPLG</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <!-- CSS Internal Khusus Admin (Gaya Neubrutalism) -->
    <style>
        /* Latar belakang grid kotak-kotak bersih */
        body {
            background-color: #fcfcfc;
            background-image: 
                linear-gradient(to right, #ececec 1px, transparent 1px),
                linear-gradient(to bottom, #ececec 1px, transparent 1px);
            background-size: 24px 24px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Sidebar warna cerah */
        .custom-nav-bg {
          background-color: #fffdf9;
          border-right: 3px solid #000000;
        }

        .nav-link-active {
          background-color: #ffcc00 !important;
          color: #000000 !important;
          border: 2px solid #000000 !important;
          font-weight: 800 !important;
          box-shadow: 2px 2px 0px #000000;
        }

        .nav-link-idle {
          color: #4b5563;
          font-weight: 700;
          border: 2px solid transparent;
          transition: all 0.1s ease-in-out;
        }

        .nav-link-idle:hover {
          background-color: #f3f4f6;
          color: #000000;
          border: 2px solid #000000;
          box-shadow: 2px 2px 0px #000000;
        }

        /* Card Konten ala Neubrutalism */
        .neubrutal-card {
            background: #ffffff;
            border: 3px solid #000000;
            border-radius: 1rem;
            box-shadow: 4px 4px 0px #000000;
        }

        /* Header & Panel Styles */
        .admin-header {
            background: #ffffff;
            border-bottom: 3px solid #000000;
        }

        .sidebar-brand {
            border-bottom: 3px solid #000000;
        }

        .sidebar-logout {
            border-top: 3px solid #000000;
        }

        /* Tombol & Input Neubrutalism */
        .btn-neubrutal {
            border: 2px solid #000000;
            box-shadow: 2px 2px 0px #000000;
            font-weight: 800;
            transition: all 0.1s ease;
        }
        .btn-neubrutal:hover {
            transform: translate(-1px, -1px);
            box-shadow: 3px 3px 0px #000000;
        }
        .btn-neubrutal:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #000000;
        }

        .input-neubrutal {
            border: 2px solid #000000;
            box-shadow: 2px 2px 0px #000000;
            font-weight: 600;
            outline: none;
        }
        .input-neubrutal:focus {
            background-color: #fffdf9;
        }
    </style>
</head>
<body class="font-sans antialiased text-black overflow-x-hidden">
    <div class="flex h-screen overflow-hidden w-full">

        <!-- OVERLAY SIDEBAR MOBILE -->
        <div id="sidebarOverlay" class="fixed inset-0 bg-black/50 z-40 hidden" onclick="toggleSidebar()"></div>

        <!-- SIDEBAR UTAMA -->
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 custom-nav-bg flex flex-col justify-between shrink-0 transform -translate-x-full md:translate-x-0 md:static transition-transform duration-200 ease-in-out">
            <div>
                <div class="p-4 sm:p-6 sidebar-brand flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-[#ffcc00] border-2 border-black rounded-full flex items-center justify-center font-black text-black shadow-[2px_2px_0px_#000]">A</div>
                        <div>
                            <p class="font-extrabold text-gray-900 text-sm leading-tight">Museum Karya</p>
                            <p class="text-xs font-bold text-gray-600">SMKN 4</p>
                        </div>
                    </div>
                    <button type="button" onclick="toggleSidebar()" class="md:hidden p-1 bg-white rounded-lg border-2 border-black font-bold hover:bg-gray-100 cursor-pointer">
                        <svg class="w-5 h-5 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                </div>
                
                <nav class="mt-4 sm:mt-6 space-y-2 px-3 sm:px-4">
                    <a href="dashboard.html" class="flex items-center gap-3 px-4 py-2.5 sm:py-3 rounded-xl nav-link-idle">
                        <span>Dashboard</span>
                    </a>
                    <a href="karya.html" class="flex items-center gap-3 px-4 py-2.5 sm:py-3 rounded-xl nav-link-idle">
                        <span>Karya</span>
                    </a>
                    <a href="siswa.html" class="flex items-center gap-3 px-4 py-2.5 sm:py-3 rounded-xl nav-link-idle">
                        <span>Siswa</span>
                    </a>
                    <a href="kategori.html" class="flex items-center gap-3 px-4 py-2.5 sm:py-3 rounded-xl nav-link-idle">
                        <span>Kategori</span>
                    </a>
                    <a href="users.html" class="flex items-center gap-3 px-4 py-2.5 sm:py-3 rounded-xl nav-link-idle">
                        <span>Users</span>
                    </a>
                    <a href="artikel.html" class="flex items-center gap-3 px-4 py-2.5 sm:py-3 rounded-xl nav-link-active">
                        <span>Artikel</span>
                    </a>
                    <a href="kode-unik.html" class="flex items-center gap-3 px-4 py-2.5 sm:py-3 rounded-xl nav-link-idle">
                        <span>Kode Unik</span>
                    </a>
                </nav>
            </div>
            
            <div class="p-4 sm:p-6 sidebar-logout bg-[#fffdf9]">
                <button type="button" onclick="openLogoutModal()" class="w-full px-4 py-2.5 bg-red-500 text-white rounded-xl btn-neubrutal cursor-pointer">
                    Logout
                </button>
            </div>
        </aside>

        <!-- AREA KONTEN UTAMA -->
        <div class="flex-1 flex flex-col h-screen overflow-y-auto overflow-x-hidden min-w-0">
            
            <!-- HEADER UTAMA WITH HAMBURGER -->
            <header class="admin-header z-10 shrink-0 sticky top-0 w-full">
                <div class="px-4 sm:px-8 py-3.5 flex justify-between items-center gap-3">
                    <div class="flex items-center gap-3">
                        <button type="button" onclick="toggleSidebar()" class="md:hidden p-2 bg-[#ffcc00] rounded-xl border-2 border-black shadow-[2px_2px_0px_#000] focus:outline-none cursor-pointer hover:bg-yellow-400 transition">
                            <svg class="w-6 h-6 stroke-black" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M4 6h16M4 12h16M4 18h16"/>
                            </svg>
                        </button>
                        <h1 class="text-base sm:text-2xl font-black text-gray-900 tracking-tight truncate">Tambah Artikel Baru</h1>
                    </div>

                    <div class="flex items-center gap-3 sm:gap-4 shrink-0">
                        <a href="artikel.html" class="px-3.5 py-2 bg-gray-200 text-gray-800 rounded-xl btn-neubrutal text-xs sm:text-sm">
                            ← Kembali
                        </a>
                        <div class="text-right hidden md:block">
                            <p class="font-extrabold text-gray-900 text-xs sm:text-sm">Administrator</p>
                            <p class="text-[10px] sm:text-xs text-gray-500 font-bold">Login sebagai admin</p>
                        </div>
                    </div>
                </div>
            </header>

            <!-- MAIN KONTEN -->
            <main class="flex-1 p-3 sm:p-6 md:p-8 relative w-full overflow-x-hidden">
                <!-- SPINNER OVERLAY LOADING -->
                <div id="loading-content" class="absolute inset-0 bg-[#fcfcfc]/90 z-40 flex flex-col items-center justify-center transition-opacity duration-300 ease-out m-0">
                    <div class="flex items-center gap-3 bg-white px-6 py-3 rounded-xl border-3 border-black shadow-[4px_4px_0px_#000]">
                        <div class="w-5 h-5 border-3 border-black border-t-[#ffcc00] rounded-full animate-spin"></div>
                        <p class="text-gray-900 font-extrabold text-sm tracking-wide">Memuat formulir artikel...</p>
                    </div>
                </div>

                <!-- FORM CARD NEUBRUTALISM -->
                <div class="max-w-3xl mx-auto neubrutal-card p-5 sm:p-8">
                    <form id="articleForm" action="#" onsubmit="event.preventDefault(); alert('Artikel berhasil disimpan!'); window.location.href='artikel.html';" class="space-y-5 sm:space-y-6">
                        
                        <!-- Judul Artikel -->
                        <div>
                            <label class="block text-sm font-black text-gray-900 mb-2">Judul Artikel <span class="text-red-500">*</span></label>
                            <input type="text" name="title" required class="w-full px-4 py-2.5 rounded-xl input-neubrutal text-sm text-gray-900" placeholder="Masukkan Judul Artikel...">
                        </div>

                        <!-- Kategori Artikel -->
                        <div>
                            <label class="block text-sm font-black text-gray-900 mb-2">Kategori Artikel <span class="text-red-500">*</span></label>
                            <select name="category_id" required class="w-full px-4 py-2.5 rounded-xl input-neubrutal text-sm text-gray-900 bg-white">
                                <option value="">Pilih Kategori</option>
                                <option value="1">Web Development</option>
                                <option value="2">Mobile App</option>
                                <option value="3">UI/UX Design</option>
                                <option value="4">Game Development</option>
                            </select>
                        </div>

                        <!-- Ringkasan Singkat -->
                        <div>
                            <label class="block text-sm font-black text-gray-900 mb-2">Ringkasan Singkat <span class="text-red-500">*</span></label>
                            <textarea name="excerpt" rows="2" required class="w-full px-4 py-2.5 rounded-xl input-neubrutal text-sm text-gray-900" placeholder="Masukkan ringkasan singkat untuk artikel..."></textarea>
                        </div>

                        <!-- Status Artikel -->
                        <div>
                            <label class="block text-sm font-black text-gray-900 mb-2">Status Artikel <span class="text-red-500">*</span></label>
                            <select name="status" required class="w-full px-4 py-2.5 rounded-xl input-neubrutal text-sm text-gray-900 bg-white">
                                <option value="">Pilih Status</option>
                                <option value="draft">Draft</option>
                                <option value="published">Published (Terbit)</option>
                            </select>
                        </div>

                        <!-- Isi Artikel -->
                        <div>
                            <label class="block text-sm font-black text-gray-900 mb-2">Isi Artikel <span class="text-red-500">*</span></label>
                            <textarea name="content" rows="8" required class="w-full px-4 py-2.5 rounded-xl input-neubrutal text-sm text-gray-900" placeholder="Masukkan Isi Artikelnya yang berunsur 5W + 1H...."></textarea>
                        </div>

                        <!-- Gambar Sampul -->
                        <div>
                            <label class="block text-sm font-black text-gray-900 mb-2">Gambar Sampul (Cover) <span class="text-red-500">*</span></label>
                            <input type="file" name="cover" accept="image/*" required onchange="previewCover(event)" class="w-full p-2 border-2 border-black rounded-xl text-xs sm:text-sm bg-gray-50 file:mr-4 file:py-1.5 file:px-3 file:rounded-lg file:border-2 file:border-black file:bg-[#ffcc00] file:font-black file:text-xs file:cursor-pointer">
                            
                            <div id="coverPreviewWrap" class="hidden mt-3 p-2 bg-gray-100 border-2 border-black rounded-xl">
                                <p class="text-xs font-black text-gray-700 mb-2">Preview Cover:</p>
                                <img id="coverPreview" class="w-full max-h-56 object-cover rounded-lg border-2 border-black shadow-[2px_2px_0px_#000]" />
                            </div>
                        </div>

                        <!-- Tombol Aksi -->
                        <div class="flex gap-3 sm:gap-4 pt-4 border-t-3 border-black">
                            <button type="button" onclick="resetForm()" class="flex-1 px-4 py-2.5 bg-gray-200 text-gray-800 rounded-xl btn-neubrutal cursor-pointer text-sm">
                                Reset
                            </button>
                            <button type="submit" class="flex-1 px-4 py-2.5 bg-[#ffcc00] text-black rounded-xl btn-neubrutal cursor-pointer text-sm">
                                Simpan Artikel
                            </button>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <!-- MODAL POP-UP LOGOUT -->
    <div id="logoutModal" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl border-3 border-black shadow-[6px_6px_0px_#000] max-w-md w-full overflow-hidden">
            <div class="bg-[#ffcc00] border-b-3 border-black p-5 text-black flex items-center gap-3">
                <div class="p-2 bg-white border-2 border-black rounded-lg shadow-[2px_2px_0px_#000]">
                    <svg class="w-6 h-6 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                    </svg>
                </div>
                <h3 class="text-lg font-black tracking-tight">Konfirmasi Keluar</h3>
            </div>

            <div class="p-6 text-center">
                <p class="text-gray-800 font-bold leading-relaxed text-base">
                    Apakah Anda yakin ingin keluar dari sistem?
                </p>
            </div>

            <div class="bg-gray-50 px-6 py-4 flex gap-3 justify-end border-t-3 border-black">
                <button type="button" onclick="closeLogoutModal()" class="px-5 py-2.5 bg-gray-200 text-gray-800 rounded-xl btn-neubrutal cursor-pointer">
                    Tidak
                </button>
                <button type="button" onclick="confirmLogout()" class="px-5 py-2.5 bg-red-500 text-white rounded-xl btn-neubrutal cursor-pointer">
                    Ya
                </button>
            </div>
        </div>
    </div>

    <!-- SCRIPT JAVASCRIPT INTERNAL -->
    <script>
        // Toggle Sidebar Nav Mobile
        function toggleSidebar() {
            const sidebar = document.getElementById("sidebar");
            const overlay = document.getElementById("sidebarOverlay");
            sidebar.classList.toggle("-translate-x-full");
            overlay.classList.toggle("hidden");
        }

        // Loading Screen Animation
        window.addEventListener("load", () => {
            const loadingContent = document.getElementById("loading-content");
            if (loadingContent) {
                setTimeout(() => {
                    loadingContent.classList.add("opacity-0");
                    setTimeout(() => loadingContent.classList.add("hidden"), 300);
                }, 700);
            }
        });

        // Reset Form & Preview Gambar
        function resetForm() {
            document.getElementById("articleForm").reset();
            document.getElementById("coverPreviewWrap").classList.add("hidden");
        }

        // Preview Cover Image
        function previewCover(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById("coverPreview").src = e.target.result;
                    document.getElementById("coverPreviewWrap").classList.remove("hidden");
                };
                reader.readAsDataURL(file);
            }
        }

        // Logout Modal Logic
        function openLogoutModal() {
            document.getElementById('logoutModal').classList.remove('hidden');
        }

        function closeLogoutModal() {
            document.getElementById('logoutModal').classList.add('hidden');
        }

        function confirmLogout() {
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
